name: bridge

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install herdr (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install herdr (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://herdr.dev/install.ps1 | iex
          # iex does not persist PATH to later steps: reload the user/machine PATH and export it.
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + [Environment]::GetEnvironmentVariable('Path','Machine')
          $cmd = Get-Command herdr -ErrorAction SilentlyContinue
          if (-not $cmd) { throw 'herdr not found on PATH after install' }
          Split-Path $cmd.Source | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - name: herdr version
        shell: bash
        run: herdr --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Integration tests (bridge/test/integration) run automatically when herdr is on PATH.
      - run: pnpm -r test
      - name: Windows install smoke (install.ps1 + Task Scheduler + status + pair)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun build bridge/src/cli.ts --compile --target=bun-windows-x64 --outfile dist/herdr-bridge-bun-windows-x64.exe
          # Invoke-WebRequest has no file:// support: serve dist/ over local HTTP like a release.
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $env:HERDR_BRIDGE_BASE_URL = 'http://127.0.0.1:8765'
          & ./scripts/install.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\HerdrBridge\herdr-bridge.exe'
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            $out = (& $exe status 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { $ok = $true }
          }
          Write-Host $out
          if (-not $ok) { Get-Content (Join-Path $env:USERPROFILE '.herdr-mobile\bridge.log') -ErrorAction SilentlyContinue; throw 'bridge did not come up via Task Scheduler' }
          & $exe pair
          if ($LASTEXITCODE -ne 0) { throw "pair failed ($LASTEXITCODE)" }
          & $exe uninstall
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
      - name: Print herdr socket / named-pipe path (record in bridge/README.md)
        if: always()
        continue-on-error: true
        shell: bash
        run: herdr session list --json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: bun scripts/build-bridge.ts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/herdr-bridge-bun-*
            scripts/install.sh
            scripts/install.ps1
